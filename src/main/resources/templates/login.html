<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In — StockMaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/stockmaster.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-header {
            background: #0f172a;
            padding: 2.25rem 2rem 1.75rem;
            text-align: center;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .login-body {
            padding: 2rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-3 mb-3"
             style="background: linear-gradient(135deg, #2563eb, #38bdf8); box-shadow: 0 8px 20px rgba(37,99,235,0.4);">
            <i class="bi bi-boxes fs-1 text-white"></i>
        </div>
        <h3 class="fw-bold mb-1">StockMaster</h3>
        <p class="text-secondary small mb-0">Advanced DSA Inventory Management</p>
    </div>

    <div class="login-body">
        <!-- Error / Success messages -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small d-flex align-items-center gap-2">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" name="redirect" th:value="${redirect}" />

            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-secondary">Admin Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username"
                           value="admin" required autofocus placeholder="Enter admin username">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password"
                           value="admin123" required placeholder="Enter password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Command Center
            </button>
        </form>

        <div class="mt-4 p-2 bg-light rounded text-center border">
            <small class="text-muted d-block">Default Evaluation Credentials:</small>
            <span class="badge bg-secondary-subtle text-dark border me-1">Username: <strong>admin</strong></span>
            <span class="badge bg-secondary-subtle text-dark border">Password: <strong>admin123</strong></span>
        </div>

        <div class="mt-3 text-center">
            <small class="text-muted" style="font-size: 0.72rem;">
                <i class="bi bi-shield-check text-success me-1"></i> BCrypt Hashed Security &bull; University A6 Project
            </small>
        </div>
    </div>
</div>

</body>
</html>
