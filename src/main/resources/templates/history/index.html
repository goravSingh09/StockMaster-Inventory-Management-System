<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventory & Sales History')}"></head>
<body>

<aside th:replace="~{fragments/layout :: sidebar('history')}"></aside>

<div class="sm-main-wrapper">
    <header th:replace="~{fragments/layout :: topbar('Comprehensive Inventory & Sales Audit Trail')}"></header>

    <main class="sm-content-area">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <!-- Filter Bar -->
        <div class="sm-card mb-4">
            <div class="sm-card-body p-3">
                <form th:action="@{/history}" method="get" class="row g-2 align-items-end">
                    <!-- Transaction Type Filter -->
                    <div class="col-12 col-md-3">
                        <label for="type" class="form-label small text-muted mb-1 fw-semibold">Movement Type</label>
                        <select name="type" id="type" class="form-select form-select-sm" onchange="this.form.submit()">
                            <option value="ALL">All Types (Stock In, Out, Sales, Init)</option>
                            <option th:each="t : ${transactionTypes}" th:value="${t.name()}" th:text="${t.displayName}"
                                    th:selected="${t.name() == selectedType}"></option>
                        </select>
                    </div>

                    <!-- Product Filter -->
                    <div class="col-12 col-md-3">
                        <label for="productId" class="form-label small text-muted mb-1 fw-semibold">Filter by Product</label>
                        <select name="productId" id="productId" class="form-select form-select-sm" onchange="this.form.submit()">
                            <option value="">All Products</option>
                            <option th:each="p : ${products}" th:value="${p.id}"
                                    th:text="${p.productCode} + ' - ' + ${p.name}"
                                    th:selected="${p.id == selectedProductId}"></option>
                        </select>
                    </div>

                    <!-- Start Date -->
                    <div class="col-12 col-md-2">
                        <label for="startDate" class="form-label small text-muted mb-1 fw-semibold">From Date</label>
                        <input type="date" name="startDate" id="startDate" class="form-control form-control-sm"
                               th:value="${startDate}" onchange="this.form.submit()">
                    </div>

                    <!-- End Date -->
                    <div class="col-12 col-md-2">
                        <label for="endDate" class="form-label small text-muted mb-1 fw-semibold">To Date</label>
                        <input type="date" name="endDate" id="endDate" class="form-control form-control-sm"
                               th:value="${endDate}" onchange="this.form.submit()">
                    </div>

                    <!-- Reset Filters Button -->
                    <div class="col-12 col-md-2">
                        <a th:href="@{/history}" class="btn btn-sm btn-light border w-100">
                            <i class="bi bi-arrow-counterclockwise me-1"></i> Reset Filters
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- History Records Table Card -->
        <div class="sm-card">
            <div class="sm-card-header">
                <div>
                    <h6 class="sm-card-title mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>Audit Trail Log</h6>
                    <small class="text-muted" style="font-size: 0.75rem;">Showing <span th:text="${transactions.size()}">0</span> logged transactions</small>
                </div>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="window.print()">
                    <i class="bi bi-printer me-1"></i> Print Log
                </button>
            </div>

            <div class="table-responsive">
                <table class="table sm-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Timestamp</th>
                            <th>Type</th>
                            <th>Product</th>
                            <th class="text-end">Units</th>
                            <th>Stock Delta</th>
                            <th>Reason / Reference</th>
                            <th>Operator</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="tx, stat : ${transactions}">
                            <td th:text="${stat.count}">1</td>
                            <td>
                                <small class="text-dark fw-semibold" th:text="${#temporals.format(tx.createdAt, 'dd MMM yyyy')}">24 Nov 2026</small><br>
                                <small class="text-muted" th:text="${#temporals.format(tx.createdAt, 'HH:mm:ss')}">14:30:15</small>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${tx.transactionType.name() == 'STOCK_IN' ? 'badge-stock-in' : (tx.transactionType.name() == 'STOCK_OUT' ? 'badge-stock-out' : (tx.transactionType.name() == 'SALE' ? 'bg-primary-subtle text-primary border' : 'bg-light text-dark border'))}"
                                      th:text="${tx.transactionType}">STOCK_IN</span>
                            </td>
                            <td>
                                <strong th:text="${tx.product.name}">Product Name</strong><br>
                                <span class="font-monospace small text-muted" th:text="${tx.product.productCode}">PRD-101</span>
                            </td>
                            <td class="text-end fw-bold"
                                th:classappend="${tx.transactionType.name() == 'STOCK_IN' || tx.transactionType.name() == 'INITIAL' ? 'text-success' : 'text-danger'}"
                                th:text="${tx.transactionType.name() == 'STOCK_IN' || tx.transactionType.name() == 'INITIAL' ? '+' + tx.quantity : '-' + tx.quantity}">+10</td>
                            <td>
                                <span class="text-muted small" th:text="${tx.previousQuantity} + ' &rarr; '"></span>
                                <strong th:text="${tx.newQuantity}">20</strong>
                            </td>
                            <td>
                                <div class="text-dark small" th:text="${tx.reason}">Reason description</div>
                                <small class="text-muted font-monospace" th:if="${tx.referenceNumber}" th:text="'Ref: ' + ${tx.referenceNumber}">Ref: PO-102</small>
                            </td>
                            <td>
                                <span class="badge bg-light text-secondary border" th:text="${tx.createdBy}">Admin</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(transactions)}">
                            <td colspan="8" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary"></i>
                                <h6>No inventory transactions match the selected filter parameters.</h6>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
