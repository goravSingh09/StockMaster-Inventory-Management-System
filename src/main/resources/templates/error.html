<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('System Error')}"></head>
<body>

<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="sm-card p-5">
                <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3 d-block"></i>
                <h3 class="fw-bold mb-2 text-dark" th:text="${errorTitle != null ? errorTitle : 'Unexpected Error'}">Unexpected Error</h3>
                <p class="text-secondary mb-4" th:text="${errorMessage != null ? errorMessage : 'The server encountered an issue processing your request.'}">
                    Please return to the dashboard or contact your administrator.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/dashboard}" class="btn btn-primary">
                        <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
                    </a>
                    <a href="javascript:history.back()" class="btn btn-light border">
                        <i class="bi bi-arrow-left me-1"></i> Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
