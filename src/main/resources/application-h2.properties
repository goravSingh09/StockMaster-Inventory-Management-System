# ===================================================================
# Optional Development / Fallback Profile: File-based H2 (MySQL Mode)
# Activate via: java -jar app.jar --spring.profiles.active=h2
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/stockmaster_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
