# ===================================================================
# StockMaster Spring Boot Application Configuration
# ===================================================================
spring.application.name=StockMaster
server.port=8080

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Default Database Configuration: File-based Persistent DB with MySQL Compatibility Mode
# Satisfies persistent database requirement across restarts without requiring root service privileges.
spring.datasource.url=jdbc:h2:file:./data/stockmaster_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.stockmaster=INFO
logging.level.org.springframework.web=INFO
