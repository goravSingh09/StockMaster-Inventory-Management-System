# ===================================================================
# StockMaster Spring Boot Application Configuration
# Primary Database: MySQL 8.0 Enterprise Relational Store
# ===================================================================
spring.application.name=StockMaster
server.port=${PORT:8080}

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Primary Production Database: MySQL 8.0
# Automatically maps cloud environment variables (Render / Railway / Aiven / TiDB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/stockmaster_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:root}}

# JPA / Hibernate Configuration for MySQL 8.0
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.stockmaster=INFO
logging.level.org.springframework.web=INFO
