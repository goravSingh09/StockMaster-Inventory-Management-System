# ===================================================================
# StockMaster MySQL 8.0 Native Production Profile Configuration
# Activate via: java -jar app.jar --spring.profiles.active=mysql
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/stockmaster_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
